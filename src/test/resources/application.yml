spring:
  application:
    name: base-authorization
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
    loadbalancer:
      retry:
        enabled: true
  datasource:
    url: jdbc:h2:mem:os_base_auth;MODE=mysql;INIT=RUNSCRIPT FROM 'classpath:db/os-base-auth-ddl.sql'
    username: root
    password: root123
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:.
    baseline-on-migrate: true

logging:
  level:
    org.springframework.web: info
    org.apache.ibatis: info
    java.sql.PreparedStatement: info
    java.sql.Statement: info
    Java.sql.Connection: info

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-value: "Y" # 逻辑已删除值(默认为 Y)
      logic-not-delete-value: "N" # 逻辑未删除值(默认为 N)
      table-prefix: base_auth_
